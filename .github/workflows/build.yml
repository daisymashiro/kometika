name: Build Kometika Release

on:
  workflow_dispatch:

permissions:
  contents: write  

jobs:
  build:
    name: Build for ${{ matrix.goos }}_${{ matrix.goarch }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: arm64           
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Download dependensi
        run: go mod download

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm || '' }}
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then
            EXT=".exe"
          fi
          
          OUTPUT_NAME="kometika_bot-${GOOS}-${GOARCH}${EXT}"
          
          go build -ldflags="-s -w" -o "$OUTPUT_NAME"
          
          echo "OUTPUT_FILE=$OUTPUT_NAME" >> $GITHUB_ENV

      - name: Cek binary
        run: |
          file "$OUTPUT_FILE"
          ls -lh "$OUTPUT_FILE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kometika_bot-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.OUTPUT_FILE }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
  # if: startsWith(github.ref, 'refs/tags/v')   ← hapus baris ini
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload ke Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: manual-${{ github.run_number }}
          name: "Release manual #${{ github.run_number }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_KOMETIKA }}
